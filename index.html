<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freeCodeCamp Survey Form Project | Melek Redwan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header>
        <h1 id="title">
            <i class="fas fa-mug-hot"></i> Coffee Survey
        </h1>
        <p id="description">Part of the the freeCodeCamp cirriculum. Done for fun :-).</p>
    </header>
    <main>
        <form id="survey-form" class="survey-form">
            <!-- Name, email, age fields -->
            <div class="form-group">
                <label for="name" id="name-label" class="form-label">
                    <i class="fas fa-user" aria-hidden="true"></i> Name
                </label>
                <input name="name" type="text" id="name" class="form-input" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email" id="email-label" class="form-label">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input name="email" type="email" id="email" class="form-input" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="number" id="number-label" class="form-label">
                     <i class="fas fa-coffee"></i> How many cups of coffee do you drink per day?
                </label>
                <input type="number" id="number" class="form-input" min="0" max="9999999" placeholder="Enter cups per day" required>
            </div>
            <!-- Select dropdown -->
            <div class="form-group">
                <label for="drodpown" class="form-label">
                    <i class="fas fa-blender"></i> What's your preferred brewing method?
                </label>
                <select name="untitled" id="dropdown" class="form-select">
                    <option value="">Select an option</option>
                    <option value="aeropress">AeroPress</option>
                    <option value="cold-brew">Cold Brew</option>
                    <option value="drip">Drip</option>
                    <option value="espresso-machine">Espresso Machine</option>
                    <option value="french-press">French Press</option>
                    <option value="percolator">Percolator</option>
                    <option value="pour-over">Pour Over</option>
                    <option value="turkish">Turkish</option>
                </select>
            </div>
            <!-- Radio buttons -->
            <div class="form-group">
                <p class="form-label">
                    <i class="fas fa-mug-hot"></i> How do you like your coffee? (choose one)
                </p>
                <label class="form-radio-label">
                    <i class="fas fa-mug-saucer"></i>
                    <input type="radio" name="preference" id="black" value="black" required> Black
                </label>
                <label class="form-radio-label">
                    <i class="fas fa-cloud"></i>
                    <input type="radio" name="preference" id="cream" value="cream" required> Cream
                </label>
                <label class="form-radio-label">
                    <i class="fas fa-glass-water"></i>
                    <input type="radio" name="preference" id="milk" value="milk" required> Milk
                </label>
                <label class="form-radio-label">
                    <i class="fas fa-jug-detergent"></i>
                    <input type="radio" name="preference" id="cream-milk" value="cream-milk" required> Cream and Milk
                </label>
                <label class="form-radio-label">
                    <i class="fas fa-ice-cream"></i>
                    <input type="radio" name="preference" id="iced" value="iced" required> Iced
                </label>
            </div>
            <!-- Checkboxes -->
            <div class="form-group">
                <p class="form-label">
                    <i class="fas fa-spoon"></i> What flavours do you like? (if any)
                </p>
                <label class="form-checkbox-label">
                    <i class="fas fa-leaf"></i>
                    <input type="checkbox" name="flavour" id="vanilla" value="vanilla" class="form-checkbox"> Vanilla
                </label>
                <label class="form-checkbox-label">
                    <i class="fas fa-candy-cane"></i>
                    <input type="checkbox" name="flavour" id="caramel" value="caramel" class="form-checkbox"> Caramel
                </label>
                <label class="form-checkbox-label">
                    <i class="fas fa-seedling"></i>
                    <input type="checkbox" name="flavour" id="hazelnut" value="hazelnut" class="form-checkbox"> Hazelnut
                </label>
                <label class="form-checkbox-label">
                    <i class="fas fa-star"></i>
                    <input type="checkbox" name="flavour" id="pumpkin-spice" value="pumpkin-spice" class="form-checkbox"> Pumpkin Spice
                </label>
                <label class="form-checkbox-label">
                    <i class="fas fa-cow"></i>
                    <input type="checkbox" name="flavour" id="whipped-cream" value="whipped-cream" class="form-checkbox"> Whipped Cream
                </label>
                <label class="form-checkbox-label">
                    <i class="fas fa-cookie"></i>
                    <input type="checkbox" name="flavour" id="chocolate-syrup" value="chocolate-syrup" class="form-checkbox"> Chocolate syrup
                </label>
            </div>
            <!-- Additional Comments -->
             <div class="form-group">
                <label for="comments" class="form-label">
                    <i class="fas fa-heart"></i> Why do you love coffee? (or don't [weird])
                </label>
                <textarea name="comments" id="comments" class="form-textarea" placeholder="e.g., CAFFEINE IS AMAZING"></textarea>
             </div>
            <!-- Submit -->
            <div class="form-group">
                <button id="submit" type="submit">Submit</button>
            </div>
        </form>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-copyright">&copy; 2025 Melek Redwan</p>
        </div>
        <div class="footer-socials">
            <a href="https://github.com/mamlaki/fc-survey-form-25" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-github footer-social-icon" aria-label="GitHub repository"></i>
            </a>
        </div>
    </footer>
</body>
</html>
