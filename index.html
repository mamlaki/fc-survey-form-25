<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freeCodeCamp Survey Form Project | Melek Redwan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="title">freeCodeCamp Survey Form Project</h1>
        <p id="description">Part of the the freeCodeCamp cirriculum. Done for fun :-).</p>
    </header>
    <main>
        <form id="survey-form" class="survey-form">
            <!-- Name, email, age fields -->
            <div class="form-group">
                <label for="name" id="name-label" class="form-label">Name</label>
                <input name="name" type="text" id="name" class="form-input" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email" id="email-label" class="form-label">Email</label>
                <input name="email" type="email" id="email" class="form-input" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="number" id="number-label" class="form-label">Age</label>
                <input type="number" id="number" class="form-input" min="18" max="120" placeholder="Enter your age" required>
            </div>
            <!-- Select dropdown – not sure what the theme of this project is yet so placeholder content -->
            <div class="form-group">
                <label for="drodpown" class="form-label">Placeholder text</label>
                <select name="untitled" id="dropdown" class="form-select">
                    <option value="">Select an option</option>
                    <option value="...">...</option>
                    <option value="...">...</option>
                </select>
            </div>
            <!-- Radio buttons – not sure what the theme of this project is... -->
            <div class="form-group">
                <p class="form-label">Radio buttons</p>
                <label class="form-radio-label">
                    <input type="radio" name="..." id="..." value="place" required> Place
                </label>
                <label class="form-radio-label">
                    <input type="radio" name="..." id="..." value="holder" required> Holder
                </label>
            </div>
            <!-- Checkboxes – not sure what the theme of this project is... -->
            <div class="form-group">
                <p class="form-label">Placeholder text</p>
                <label class="form-checkbox-label">
                    <input type="checkbox" name="placeholder" id="placeholder" value="place" class="form-checkbox"> Placeholder
                </label>
                <label class="form-checkbox-label">
                    <input type="checkbox" name="placeholder" id="holder" value="holder" class="form-checkbox"> Placeholder
                </label>
                <label class="form-checkbox-label">
                    <input type="checkbox" name="placeholder" id="endcheck" value="endcheck" class="form-checkbox"> Placeholder
                </label>
            </div>
            <!-- Additional Comments -->
             <div class="form-group">
                <label for="comments" class="form-label">Additional comments</label>
                <textarea name="comments" id="comments" class="form-textarea" placeholder="Enter your comments here"></textarea>
             </div>
            <!-- Submit -->
            <div class="form-group">
                <button id="submit" type="submit">Submit</button>
            </div>
        </form>
    </main>
    <footer>
    </footer>
</body>
</html>
